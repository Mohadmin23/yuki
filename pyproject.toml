[project]
name = "llama-voice-assist"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.49.2",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.136.1",
    "granian>=2.7.4",
    "kokoro>=0.9.4",
    "mlx-lm>=0.31.3",
    "numpy>=2.4.4",
    "openai>=2.36.0",
    "psutil>=7.2.2",
    "soundfile>=0.13.1",
    "sqlite-vec>=0.1.9",
    "torch>=2.11.0",
    "transformers>=5.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
