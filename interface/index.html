<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voice Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* ── BUBBLE SECTION — takes all remaining space, centers content ── */
    .bubble-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .bubble-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 520px;
      height: 520px;
    }

    /* Outer ripple rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid #2563eb33;
      animation: none;
      transition: opacity 0.3s;
    }
    .ring-1 { width: 440px; height: 440px; }
    .ring-2 { width: 500px; height: 500px; border-color: #2563eb1a; }

    body.speaking .ring-1 { animation: ripple 1.4s ease-out infinite; }
    body.speaking .ring-2 { animation: ripple 1.4s ease-out infinite 0.35s; }

    @keyframes ripple {
      0%   { transform: scale(0.92); opacity: 1; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    /* Main bubble */
    .bubble {
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #1e3a8a, #0f172a);
      border: 2px solid #2563eb55;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: box-shadow 0.3s, border-color 0.3s;
      box-shadow: 0 0 30px #2563eb22;
    }

    body.speaking .bubble {
      border-color: #3b82f6;
      box-shadow: 0 0 50px #2563eb55;
    }

    /* Idle breathing */
    body:not(.speaking) .bubble {
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 30px #2563eb22; }
      50%       { transform: scale(1.04); box-shadow: 0 0 45px #2563eb44; }
    }

    /* Bars visualizer */
    .bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 200px;
      height: 100px;
    }
    .bar {
      width: 6px;
      border-radius: 6px;
      background: linear-gradient(to top, #1d4ed8, #60a5fa);
      height: 8px;
      transition: height 0.05s ease;
      flex-shrink: 0;
    }

    /* Idle animation handled by JS */

    /* Status label */
    .status {
      margin-top: 16px;
      font-size: 13px;
      color: #555;
      letter-spacing: 0.5px;
      height: 18px;
      transition: color 0.3s;
    }
    body.speaking .status  { color: #3b82f6; }
    body.thinking .status  { color: #a78bfa; }

    /* ── OUTPUT TEXT ── */
    .output {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 32px;
      text-align: center;
      min-height: 60px;
    }
    .output-text {
      font-size: 24px;
      font-weight: 300;
      line-height: 2;
      color: #fff;
      max-width: 620px;
      text-align: center;
      letter-spacing: 0.01em;
    }
    .output-text .word {
      display: inline-block;
      opacity: 0;
      filter: blur(14px);
      transform: scale(0.92);
      transition: opacity 0.5s cubic-bezier(0.22,1,0.36,1),
                  filter 0.5s cubic-bezier(0.22,1,0.36,1),
                  transform 0.5s cubic-bezier(0.22,1,0.36,1);
      margin-right: 6px;
    }
    .output-text .word.show {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1);
    }
    .output-text .word.hide {
      opacity: 0;
      filter: blur(14px);
      transform: scale(0.92);
      transition: opacity 0.35s ease-in,
                  filter 0.35s ease-in,
                  transform 0.35s ease-in;
    }

    /* Thinking dots in output area */
    .dots {
      display: none;
      gap: 6px;
      align-items: center;
      justify-content: center;
    }
    .dots.visible { display: flex; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #a78bfa;
      animation: dotBlink 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBlink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.7); }
      40%           { opacity: 1;   transform: scale(1);   }
    }

    /* ── INPUT AREA ── */
    .input-area {
      width: 100%;
      max-width: 640px;
      padding: 0 20px 28px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input-area input {
      flex: 1;
      background: #141414;
      border: 1px solid #2a2a2a;
      color: #fff;
      padding: 14px 20px;
      border-radius: 30px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-area input::placeholder { color: #444; }
    .input-area input:focus { border-color: #2563eb; }
    .input-area input:disabled { opacity: 0.4; }

    .send-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .send-btn:hover:not(:disabled) { background: #1d4ed8; transform: scale(1.06); }
    .send-btn:disabled { background: #1e1e1e; cursor: not-allowed; }

    .mic-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      background: #1c1c1e;
      color: #aaa;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, transform 0.1s;
      border: 1px solid #2a2a2a;
    }
    .mic-btn:hover:not(:disabled) { background: #2a2a2a; color: #fff; transform: scale(1.06); }
    .mic-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .mic-btn.recording {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
      animation: micPulse 1s ease-in-out infinite;
    }
    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 0 #ef444466; }
      50%       { box-shadow: 0 0 0 10px #ef444400; }
    }
  </style>
</head>
<body>

  <!-- Bubble + status centered in remaining space -->
  <div class="bubble-section">
    <div class="bubble-wrap">
      <div class="ring ring-2"></div>
      <div class="ring ring-1"></div>
      <div class="bubble">
        <div class="bars" id="bars">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
      </div>
    </div>
    <div class="status" id="status">Ready</div>
  </div>

  <!-- Output text / thinking dots -->
  <div class="output">
    <div class="dots" id="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="output-text" id="outputText"></div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <button class="mic-btn" id="micBtn" title="Hold to speak">🎙️</button>
    <input id="input" type="text" placeholder="Ask me anything…" autocomplete="off" maxlength="2000"/>
    <button class="send-btn" id="sendBtn">&#10148;</button>
  </div>

  <script>
    const inputEl   = document.getElementById('input');
    const sendBtn   = document.getElementById('sendBtn');
    const outputTxt = document.getElementById('outputText');
    const dots      = document.getElementById('dots');
    const statusEl  = document.getElementById('status');
    const bars      = Array.from(document.querySelectorAll('.bar'));

    let analyser, dataArray, animFrameId;
    let speaking = false;
    let idleT = 0;
    const CENTER = (bars.length - 1) / 2;

    function setMode(mode) {
      document.body.classList.remove('speaking', 'thinking');
      if (mode) document.body.classList.add(mode);
      const labels = { speaking: 'Speaking…', thinking: 'Thinking…', '': 'Ready' };
      statusEl.textContent = labels[mode] ?? 'Ready';
    }

    function showThinking() {
      dots.classList.add('visible');
      setMode('thinking');
    }

    let wordTimers = [];

    function clearWordTimers() {
      wordTimers.forEach(t => clearTimeout(t));
      wordTimers = [];
    }

    function showTextAnimated(text, audioDuration) {
      dots.classList.remove('visible');
      clearWordTimers();
      outputTxt.innerHTML = '';

      const words = text.trim().split(/\s+/).filter(w => w.length > 0);
      if (!words.length) return;
      const delay = (audioDuration * 1000) / words.length;

      words.forEach((word, i) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = word;
        outputTxt.appendChild(span);

        const t = setTimeout(() => span.classList.add('show'), i * delay);
        wordTimers.push(t);
      });
    }

    function setDisabled(val) {
      sendBtn.disabled = val;
      inputEl.disabled = val;
    }

    // Idle: sine wave rippling outward from center
    function drawIdle() {
      if (speaking) return;
      animFrameId = requestAnimationFrame(drawIdle);
      idleT += 0.04;
      bars.forEach((bar, i) => {
        const dist = Math.abs(i - CENTER) / CENTER;         // 0 = center, 1 = edge
        const wave = Math.sin(idleT - dist * 2.5) * 0.5 + 0.5;
        const h = 5 + wave * 12 * (1 - dist * 0.4);
        bar.style.height = h + 'px';
      });
    }

    // Speaking: all bars active, wave ripples outward from center driven by volume
    function startVisualizer(sourceNode) {
      speaking = true;
      cancelAnimationFrame(animFrameId);

      const ctx = sourceNode.context;
      analyser = ctx.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      sourceNode.connect(analyser);
      analyser.connect(ctx.destination);

      let t = 0;
      function draw() {
        if (!speaking) return;
        animFrameId = requestAnimationFrame(draw);
        t += 0.12;

        analyser.getByteFrequencyData(dataArray);
        // Average energy across all bins (overall volume)
        const vol = dataArray.reduce((s, v) => s + v, 0) / dataArray.length / 255;

        bars.forEach((bar, i) => {
          const dist = Math.abs(i - CENTER) / CENTER;     // 0=center, 1=edge
          // Wave phase shifts outward from center
          const wave = Math.sin(t - dist * 3.5) * 0.5 + 0.5;
          const h = 8 + wave * vol * 90 + vol * 18;
          bar.style.height = h + 'px';
        });
      }
      draw();
    }

    function stopVisualizer() {
      speaking = false;
      cancelAnimationFrame(animFrameId);
      clearWordTimers();
      bars.forEach(b => b.style.height = '8px');
      drawIdle();
    }

    // Start idle animation on load
    drawIdle();

    // Single shared AudioContext
    let audioCtx = null;

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      setDisabled(true);
      showThinking();

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 60000);
        let res;
        try {
          res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text }),
            signal: controller.signal
          });
        } finally {
          clearTimeout(timeout);
        }
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        // Init / resume AudioContext on first user interaction
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) throw new Error('Web Audio API not supported in this browser.');
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        const bytes  = Uint8Array.from(atob(data.audio), c => c.charCodeAt(0));
        let buffer;
        try {
          buffer = await audioCtx.decodeAudioData(bytes.buffer);
        } catch {
          throw new Error('Failed to decode audio response.');
        }
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;

        dots.classList.remove('visible');
        showTextAnimated(data.text, buffer.duration);
        setMode('speaking');
        startVisualizer(source);
        source.start();

        source.onended = () => {
          stopVisualizer();
          setMode('');
          document.querySelectorAll('.word').forEach((w, i) => {
            setTimeout(() => { w.classList.remove('show'); w.classList.add('hide'); }, i * 60);
          });
          setDisabled(false);
          if (autoHear) setTimeout(() => { if (autoHear) startListening(); }, 400);
          else inputEl.focus();
        };

      } catch (err) {
        dots.classList.remove('visible');
        outputTxt.textContent = '⚠️ ' + err.message;
        setMode('');
        setDisabled(false);
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) sendMessage(); });

    // ── VOICE INPUT (continuous loop) ──
    const micBtn = document.getElementById('micBtn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let autoHear = false;
    let isRecording = false;

    if (!SpeechRecognition) {
      micBtn.disabled = true;
      micBtn.title = 'Speech recognition not supported in this browser';
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onresult = (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
        inputEl.value = transcript;
        if (e.results[e.results.length - 1].isFinal) {
          isRecording = false;
          try { recognition.stop(); } catch (_) {}
          sendMessage();
        }
      };

      recognition.onerror = () => { isRecording = false; micBtn.classList.remove('recording'); micBtn.textContent = '🎙️'; };
      recognition.onend   = () => { isRecording = false; micBtn.classList.remove('recording'); micBtn.textContent = '🎙️'; };

      window.startListening = function() {
        if (isRecording || speaking) return;
        isRecording = true;
        inputEl.value = '';
        statusEl.textContent = 'Listening…';
        micBtn.classList.add('recording');
        micBtn.textContent = '⏹';
        try { recognition.start(); } catch (_) {}
      };

      window.stopListening = function() {
        isRecording = false;
        autoHear = false;
        micBtn.classList.remove('recording');
        micBtn.textContent = '🎙️';
        statusEl.textContent = 'Ready';
        try { recognition.stop(); } catch (_) {}
      };

      micBtn.addEventListener('click', () => {
        if (autoHear) {
          stopListening();
        } else {
          autoHear = true;
          startListening();
        }
      });
    }
  </script>
</body>
</html>
